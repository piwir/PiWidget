[package]
name = "piwidget"
version = "0.1.2"
description = "简约桌面便笺 + 周课表小组件"
edition = "2021"

[lib]
name = "piwidget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
