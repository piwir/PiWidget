name: Release (draft)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.3.0)'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build & draft release (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'PiWidget ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'PiWidget 桌面便笺 + 周课表 · Windows 安装包'
          releaseDraft: true
          args: --bundles nsis msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential curl wget file
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build & draft release (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'PiWidget ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'PiWidget 桌面便笺 + 周课表 · Linux 包'
          releaseDraft: true
          args: --bundles deb rpm
