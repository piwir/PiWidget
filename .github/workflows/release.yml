name: Release (draft)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.2.0)'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/piwidget.exe -DestinationPath piwidget-windows.zip
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 'PiWidget ${{ github.event.inputs.tag || github.ref_name }}'
          body: 'PiWidget 桌面便笺 + 周课表 · Windows 版（解压即用）'
          draft: true
          files: piwidget-windows.zip
